  <!-- Horizontal ribs on body -->
  <line x1="7" y1="19" x2="25" y2="19" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="7" y1="23" x2="25" y2="23" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Handle -->
