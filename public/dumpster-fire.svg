<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 36" fill="none">
  <!-- Flames -->
  <path d="M11 13 C10 9 13 6 11 2 C14 5 12 8 16 4 C15 7 18 6 16 3 C19 6 20 9 21 13" fill="#f97316"/>
  <path d="M13 13 C12 10 14 7 13 5 C15 7 14 9 17 6 C16 9 18 8 17 6 C19 8 19 11 20 13" fill="#fbbf24" opacity="0.8"/>

  <!-- Lid (gray, slightly angled open) -->
