  <!-- Wheels -->
  <circle cx="10" cy="31.5" r="2.5" fill="#374151"/>
  <circle cx="22" cy="31.5" r="2.5" fill="#374151"/>
  <circle cx="10" cy="31.5" r="1" fill="#6b7280"/>
  <circle cx="22" cy="31.5" r="1" fill="#6b7280"/>
</svg>
